    <g fill="#d5ef76"><circle cx="318" cy="65" r="5"/><circle cx="318" cy="120" r="5"/><circle cx="318" cy="175" r="5"/></g>
    <text x="20" y="224" fill="#9fb3a7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.5">PREPARE</text>
    <text x="269" y="224" fill="#9fb3a7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.5">INSPECT</text>
