<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Trialyard — Put your agent through its paces.</title>
  <desc id="desc">A dark green testing field with three marked lanes beside the Trialyard wordmark.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d5ef76" stroke-opacity=".045"/></pattern>
    <linearGradient id="field" x2="1" y2="1"><stop stop-color="#182e28"/><stop offset="1" stop-color="#0c1915"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#field)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <path d="M56 50H96" stroke="#d5ef76" stroke-width="3"/>
  <text x="110" y="55" fill="#bed0c5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">A TESTING GROUND FOR AGENTS</text>
  <text x="52" y="166" fill="#f3f6eb" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="86" font-weight="650" letter-spacing="-4">Trialyard</text>
  <text x="56" y="218" fill="#d5ef76" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26">Put your agent through its paces.</text>
  <text x="56" y="291" fill="#9fb3a7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">FRESH STATE</text>
  <circle cx="169" cy="286" r="2" fill="#627c6c"/>
  <text x="186" y="291" fill="#9fb3a7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">REAL EXECUTION</text>
  <circle cx="337" cy="286" r="2" fill="#627c6c"/>
  <text x="354" y="291" fill="#9fb3a7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">RETAINED EVIDENCE</text>
  <g transform="translate(770 50)">
    <rect width="360" height="240" rx="20" fill="#152920" stroke="#4b6753"/>
    <path d="M42 38V202M318 38V202" stroke="#789567" stroke-width="2" stroke-dasharray="3 8"/>
    <g fill="none" stroke="#4b6753"><path d="M42 65H318"/><path d="M42 120H318"/><path d="M42 175H318"/></g>
